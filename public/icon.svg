      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#002D8F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#002070" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Drop Shadow on Icon Lines -->
    <filter id="brdrg-emboss" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0.75" stdDeviation="0.4" flood-color="#00247A" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 3D Pill Base with Ambient Shadow -->
