  <defs>
    <!-- 3D Surface Gradient -->
    <linearGradient id="brdrg-bg-3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D7EFF"/>
      <stop offset="45%" stop-color="#0364FF"/>
      <stop offset="100%" stop-color="#0043CC"/>
    </linearGradient>

    <!-- 3D Rim Highlight / Bevel -->
